spring.application.name=proyectos-service
server.port=8081

# Valores directos (sin variables)
spring.datasource.url=jdbc:postgresql://ep-red-night-aqyc3sjy-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_xqWFe4Pn7JRN
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.schemas=proyectos_schema
spring.flyway.create-schemas=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.properties.hibernate.default_schema=proyectos_schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Otros
spring.sql.init.mode=never