spring.application.name=usuarios-service
server.port=8080

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forzar schema para Flyway
spring.flyway.schemas=usuarios_schema
spring.flyway.default-schema=usuarios_schema
spring.flyway.create-schemas=true

# Forzar schema para JPA
spring.jpa.properties.hibernate.default_schema=usuarios_schema

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=usuarios_schema.flyway_schema_history